pid /tmp/nginx-forwardauth.pid;
error_log /dev/stderr warn;
events {}
http {
    access_log off;
    map "$request_method:$http_accept" $autentico_browser {
        default 0;
        ~*^(GET|HEAD):.*text/html 1;
    }
    # Public IdP ingress: never relay private proxy/bootstrap routes, even
    # when a client supplies original-host headers for a protected application.
    server {
        listen 127.0.0.1:25446 ssl;
        server_name auth.example.test;
        ssl_certificate /certs/cert.pem;
        ssl_certificate_key /certs/key.pem;
        location = /forward-auth { return 404; }
        location ^~ /forward-auth/ { return 404; }
        location = /_autentico { return 404; }
        location ^~ /_autentico/ { return 404; }
        location / {
            proxy_pass http://127.0.0.1:25998;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $remote_addr;
        }
    }
    server {
        listen 127.0.0.1:25444 ssl;
        server_name nginx.example.test;
        ssl_certificate /certs/cert.pem;
        ssl_certificate_key /certs/key.pem;
        location ^~ /_autentico/ {
            proxy_pass http://127.0.0.1:25998;
            proxy_set_header X-Forwarded-Host nginx.example.test:25444;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
        }
        location = /__autentico_check {
            internal;
            proxy_pass http://127.0.0.1:25998/forward-auth/NGINX_APP_ID/check;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Cookie $http_cookie;
            proxy_set_header X-Forwarded-Host nginx.example.test:25444;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Uri $request_uri;
            proxy_set_header X-Forwarded-Method $autentico_method;
            proxy_set_header X-Forwarded-For $remote_addr;
        }
        location @autentico_login {
            if ($autentico_browser = 0) { return 401; }
            if ($auth_login = "") { return 503; }
            return 303 $auth_login;
        }
        location / {
            set $autentico_method $request_method;
            auth_request /__autentico_check;
            auth_request_set $auth_login $upstream_http_x_autentico_login;
            auth_request_set $auth_user $upstream_http_x_auth_user;
            auth_request_set $auth_email $upstream_http_x_auth_email;
            auth_request_set $auth_cookie $upstream_http_cookie;
            error_page 401 = @autentico_login;
            proxy_pass http://127.0.0.1:25999;
            proxy_set_header X-Auth-User $auth_user;
            proxy_set_header X-Auth-Email $auth_email;
            proxy_set_header X-Auth-Groups "";
            proxy_set_header X-Forwarded-Method "";
            proxy_set_header X-Forwarded-Uri "";
            proxy_set_header Cookie $auth_cookie;
            proxy_set_header Authorization "";
        }
    }
}
