name: Go CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  GO_VERSION: "1.25"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Create UI placeholders
        run: |
          mkdir -p pkg/admin/dist && echo '<!doctype html>' > pkg/admin/dist/index.html
          mkdir -p pkg/account/dist && echo '<!doctype html>' > pkg/account/dist/index.html
      - name: Download golangci-lint binary
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh | sh -s -- -b ./bin v2.13.1
      - name: Run golangci-lint
        run: ./bin/golangci-lint run ./...

  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Check formatting
        run: gofmt -l -e .

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: pnpm
          cache-dependency-path: |
            admin-ui/pnpm-lock.yaml
            account-ui/pnpm-lock.yaml
      - name: Build binary (includes admin + account UIs)
        run: make build
      - name: Build federation test fixture
        run: CGO_ENABLED=0 go test -c -o autentico-federation-fixture ./pkg/cli
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: autentico-binary
          path: autentico
          retention-days: 1
      - name: Upload federation test fixture
        uses: actions/upload-artifact@v4
        with:
          name: autentico-federation-fixture
          path: autentico-federation-fixture
          retention-days: 1

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Create UI placeholders
        run: |
          mkdir -p pkg/admin/dist && echo '<!doctype html>' > pkg/admin/dist/index.html
          mkdir -p pkg/account/dist && echo '<!doctype html>' > pkg/account/dist/index.html
      - name: Install dependencies
        run: go mod tidy
      - name: Run tests
        run: go test -p 1 -v ./...

  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Create UI placeholders
        run: |
          mkdir -p pkg/admin/dist && echo '<!doctype html>' > pkg/admin/dist/index.html
          mkdir -p pkg/account/dist && echo '<!doctype html>' > pkg/account/dist/index.html
      - name: Run go vet
        run: go vet ./...

  functional:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: autentico-binary
      - name: Download federation test fixture
        uses: actions/download-artifact@v4
        with:
          name: autentico-federation-fixture
      - name: Make binaries executable
        run: chmod +x autentico autentico-federation-fixture
      - name: Run Docker Compose migration tests
        timeout-minutes: 3
        run: |
          docker pull debian:bookworm-slim
          python3 tests/migrations/docker_smoke.py --binary "$PWD/autentico"
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: pnpm
          cache-dependency-path: tests/functional/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: tests/functional
        run: pnpm install
      - name: Run functional tests
        working-directory: tests/functional
        env:
          AUTENTICO_TEST_FEDERATION_BINARY: ${{ github.workspace }}/autentico-federation-fixture
        run: pnpm test

  smoke:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: autentico-binary
      - name: Make binary executable
        run: chmod +x autentico
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: pnpm
          cache-dependency-path: tests/browser/pnpm-lock.yaml
      - name: Install browser test dependencies
        working-directory: tests/browser
        run: pnpm install
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('tests/browser/pnpm-lock.yaml') }}
      - name: Install Playwright browsers
        working-directory: tests/browser
        run: pnpm exec playwright install chromium --with-deps
      - name: Run smoke tests
        working-directory: tests/browser
        run: pnpm exec playwright test

  tidy-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Check for uncommitted changes after go mod tidy
        run: |
          go mod tidy
          git diff --exit-code

  proxy-e2e:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        site-mode: [same-site, cross-site]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: autentico-binary
      - run: chmod +x autentico
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: pnpm
          cache-dependency-path: tests/browser/pnpm-lock.yaml
      - name: Install browser dependencies
        working-directory: tests/browser
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        working-directory: tests/browser
        run: pnpm exec playwright install chromium --with-deps
      - name: Test real Autentico with Caddy, nginx and Traefik
        run: python3 tests/proxy/run.py --binary "$PWD/autentico" --site-mode "${{ matrix.site-mode }}" --logs "$RUNNER_TEMP/forward-auth-logs"
      - name: Upload proxy diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: forward-auth-diagnostics-${{ matrix.site-mode }}
          path: |
            ${{ runner.temp }}/forward-auth-logs/*.log
            tests/browser/test-results/
