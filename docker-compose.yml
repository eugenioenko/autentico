services:
  autentico:
    build: .
    command: ["start", "--auto-setup"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:9999:9999"
    volumes:
      - autentico-data:/app/data
    environment:
      AUTENTICO_APP_URL: http://localhost:9999
      AUTENTICO_DB_FILE_PATH: /app/data/autentico.db

volumes:
  autentico-data:
